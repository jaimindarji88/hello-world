<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101820"><title>Hello World</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101820;color:#f6f4eb;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(880px,100%)}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#a9b5be}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b9f577;margin-right:10px;box-shadow:0 0 24px #b9f57766}h1{font-size:clamp(64px,13vw,132px);letter-spacing:-.07em;line-height:.95;font-weight:650;margin:42px 0 28px}h1 span{color:#b9f577}p{max-width:490px;font-size:19px;line-height:1.6;color:#b4bfc5}button{margin:24px 0 0;background:#b9f577;color:#101820;border:0;border-radius:100px;padding:17px 25px;font:600 16px system-ui;cursor:pointer}button:hover{background:#d2ffa2}button:focus-visible{outline:3px solid white;outline-offset:5px}#reply{min-height:31px;font-size:16px}footer{border-top:1px solid #ffffff20;margin-top:60px;padding-top:22px;font-size:12px;letter-spacing:.08em;color:#91a0aa;display:flex;justify-content:space-between;gap:20px}
</style></head><body><main><div class="eyebrow"><span class="dot"></span>A small beginning</div><h1>Hello<br><span>World.</span></h1><p>Every great idea starts somewhere.<br>This one starts with a simple hello.</p><button id="hello" type="button">Say hello ↗</button><p id="reply" aria-live="polite"></p><footer><span>HELLO WORLD / SAMPLE APP</span><span>Made to get started.</span></footer></main><script>let count=0;document.getElementById('hello').addEventListener('click',()=>{count++;document.getElementById('reply').textContent=count===1?'Hello, you. Glad you’re here.':`Hello again! You’ve sent ${count} hellos.`;});</script></body></html>
